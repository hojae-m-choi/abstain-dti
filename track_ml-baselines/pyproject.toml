[project]
name = "dti-fusion"
version = "0.1.0"
description = "Drug-target affinity prediction: ChemBERTa / Graph Transformer drug encoders + ESM-2 protein embeddings + multimodal fusion transformer"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    # PyPI torch wheels: macOS arm64 builds ship MPS, Linux x86_64 builds ship CUDA 12.x.
    # The same lock therefore works on an M1 laptop and on a CUDA box.
    "torch>=2.4",
    "transformers>=4.56",
    "huggingface-hub>=0.25",
    "rdkit>=2024.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dti = "dti_fusion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dti_fusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
